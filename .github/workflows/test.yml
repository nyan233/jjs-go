name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        go: ["1.22.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            go.sum
            benchmark/compare/go.sum
      - run: go test ./...
      - run: go build ./...
      - run: go test ./...
        working-directory: benchmark/compare

  macos:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go build ./...
      - run: go test -tags arm64_asm_test ./core/compiler -run '^TestARM64'

  arm64-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: true
          cache-dependency-path: go.sum
      - run: go test -tags arm64_asm_test ./core/compiler -run '^TestARM64'
      - name: Cross-compile darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go test -c -o /tmp/compiler-arm64.test ./core/compiler
          go test -c -o /tmp/jjs-arm64.test .

  arm64-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: true
          cache-dependency-path: go.sum
      - name: Install ARM64 user-mode emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user qemu-user-binfmt
          qemu-aarch64 --version
      - name: Run compiler tests under QEMU
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go test -c -o /tmp/compiler-arm64.test ./core/compiler
          qemu-aarch64 /tmp/compiler-arm64.test -test.v
      - name: Run codec tests under QEMU
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go test -c -o /tmp/jjs-arm64.test .
          set +e
          qemu-aarch64 -one-insn-per-tb -d in_asm,cpu -D /tmp/qemu.log \
            /tmp/jjs-arm64.test -test.v \
            -test.run '^TestJITCustomMarshalerAndUnmarshaler$' \
            > /tmp/qemu.stdout 2>&1
          status=$?
          cat /tmp/qemu.stdout
          fault_pc=$(grep -m1 -o 'pc=0x[0-9a-f]*' /tmp/qemu.stdout | cut -d= -f2)
          if [ -n "$fault_pc" ]; then
            fault_pc=$(printf '%016x' "$fault_pc")
            grep -B 120 -A 80 "PC=$fault_pc" /tmp/qemu.log | tail -n 700
          else
            tail -n 500 /tmp/qemu.log
          fi
          exit $status

  go-version-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.21.x", "1.22.x", "1.23.x", "1.24.x", "1.25.x", "1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
      - run: go test ./internal/jitloader ./core/compiler
