name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        go: ["1.22.x", "1.25.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            go.sum
            benchmark/compare/go.sum
      - run: go test ./...
      - run: go build ./...
      - run: go test ./...
        working-directory: benchmark/compare

  macos:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "1.25.x"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go build ./...
      - run: go test -tags arm64_asm_test ./core/compiler -run '^TestARM64'

  arm64-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: true
          cache-dependency-path: go.sum
      - run: go test -tags arm64_asm_test ./core/compiler -run '^TestARM64'
      - name: Cross-compile darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go test -c -o /tmp/compiler-arm64.test ./core/compiler
          go test -c -o /tmp/jjs-arm64.test .

  arm64-qemu:
    runs-on: ubuntu-latest
    # macOS validates native multicore JIT execution. Keep QEMU single-threaded
    # because linux-user can execute stale translations for generated pages.
    env:
      GOMAXPROCS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: true
          cache-dependency-path: go.sum
      - name: Install ARM64 user-mode emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-hwe qemu-user-binfmt-hwe
          qemu-aarch64 --version
      - name: Run compiler tests under QEMU
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go test -c -o /tmp/compiler-arm64.test ./core/compiler
          qemu-aarch64 -one-insn-per-tb /tmp/compiler-arm64.test -test.v
      - name: Run codec tests under QEMU
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go test -c -o /tmp/jjs-arm64.test .
          # linux-user can retain chained translations for freshly executable
          # JIT pages. One-instruction TBs make code-cache validation stable.
          # Native macOS runs TestJITConcurrentUse with real multicore JIT.
          qemu-aarch64 -one-insn-per-tb /tmp/jjs-arm64.test -test.v \
            -test.skip '^TestJITConcurrentUse$'

  go-version-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.21.x", "1.22.x", "1.23.x", "1.24.x", "1.25.x", "1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
      - run: go test ./internal/jitloader ./core/compiler
