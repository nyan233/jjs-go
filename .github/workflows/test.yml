name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        go: ["1.22.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            go.sum
            benchmark/compare/go.sum
      - run: go test ./...
      - run: go build ./...
      - run: go test ./...
        working-directory: benchmark/compare

  macos:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go build ./...
      - run: go test -tags arm64_asm_test ./core/compiler -run '^TestARM64'

  arm64-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: true
          cache-dependency-path: go.sum
      - run: go test -tags arm64_asm_test ./core/compiler -run '^TestARM64'
      - name: Cross-compile darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go test -c -o /tmp/compiler-arm64.test ./core/compiler
          go test -c -o /tmp/jjs-arm64.test .
